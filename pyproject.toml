[project]
name = "relieff-opt"
version = "1.0.0"
description = "Optimización de ReliefF con vecinos aproximados (ANN/HNSW) y prototipos (Proto/LVQ)"
authors = [
    {name = "Nicolás Aller", email = "nicooaller04@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["machine-learning", "feature-selection", "relieff", "hnsw", "ann"]

dependencies = [
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "hnswlib>=0.8.0",
    "numba>=0.58.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pyyaml>=6.0",
    "scipy>=1.11.0",
    "joblib>=1.3.0",
    "skrebate>=0.62",
    "codecarbon>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ipython>=8.14.0",
    "jupyter>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relieff_opt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
